plugins {
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev.legacyforge' version '2.0.91'
	id 'org.jetbrains.kotlin.jvm' version '2.2.0'
	id "me.shedaniel.unified-publishing" version "0.1.+"
}

def ENV = System.getenv()
def isLocal = !ENV.containsKey("GITHUB_RUN_NUMBER")

def archiveName = "${mod_id.replace("_", "-")}-${minecraft_version}"

version = "${mod_version}-${isLocal ? "local.${Instant.now().epochSecond}" : "build.${ENV.GITHUB_RUN_NUMBER}"}"
group = project.mod_group_id
base.archivesName = archiveName

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
compileKotlin {
	kotlinOptions.jvmTarget = "17"
}

println("Building version: ${version}")
println("Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}")

legacyForge {

	version = project.minecraft_version + '-' + project.forge_version

	validateAccessTransformers = ENV.CI != "true"
//	disableRecompilation = ENV.CI == "true"

	accessTransformers {
		publish(project.file('src/main/resources/META-INF/accesstransformer.cfg'))
	}

	parchment {
		mappingsVersion = project.mapping_version
		minecraftVersion = project.minecraft_version
	}

	runs {

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'

			logLevel = org.slf4j.event.Level.DEBUG
		}

		"Client-One" {
			client()
			ideName = "Client One"
			systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

			if (ENV.MC_CLIENT_ARGS) {
				programArguments.addAll(ENV.MC_CLIENT_ARGS.split(' '))
			}

			gameDirectory = file 'runs/client'
		}

		"Client-Two" {
			client()
			ideName = "Client Two"
			systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

			gameDirectory = file 'runs/client'

			if (ENV.MC_CLIENT_2_ARGS) {
				programArguments.addAll(ENV.MC_CLIENT_2_ARGS.split(' '))
			}
		}

		server {
			server()
			ideName = "Server"
			programArgument '--nogui'
			systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

			gameDirectory = file 'runs/server'
		}

		data {
			data()

			gameDirectory = file 'runs/client'

			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}

}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
	add sourceSets.main, "geneticsresequenced.refmap.json"
	config "geneticsresequenced.mixins.json"
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

repositories {
	mavenLocal()

	maven {
		name = 'Kotlin for Forge'
		url = 'https://thedarkcolour.github.io/KotlinForForge/'
	}

	// For EMI
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	// For Curios
	repositories {
		maven {
			name = "Illusive Soulworks maven"
			url = "https://maven.theillusivec4.top/"
		}
	}

	// For Modonomicon
	maven {
		url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
		content {
			includeGroup "com.klikli_dev"
		}
	}

	maven {
		url "https://maven.latvian.dev/releases"
		content {
			includeGroup "dev.aaronhowser.mods"
		}
	}

	maven { url 'https://maven.blamejared.com' }
	mavenCentral()

}

obfuscation {
	createRemappingConfiguration(configurations.localRuntime)
}

jar.finalizedBy('reobfJar')

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	implementation "thedarkcolour:kotlinforforge:${kff_version}"
	modImplementation "dev.aaronhowser.mods:aaron-1.20.1:${aaron_lib_version}"
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		forge_version          : forge_version,
		forge_version_range    : forge_version_range,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : mod_version,
		mod_authors            : mod_authors,
		mod_description        : mod_description,
		kff_version_range      : kff_version_range,
		aaron_lib_version_range : aaron_lib_version_range
]

processResources {
	inputs.properties replaceProperties
	replaceProperties.put 'project', project

	filesMatching(resourceTargets) {
		expand replaceProperties
	}
}

jar.finalizedBy('reobfJar')

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}

	repositories {
		if (ENV.MAVEN_URL && ENV.MAVEN_USERNAME && ENV.MAVEN_TOKEN) {
			maven {
				url = ENV.MAVEN_URL
				credentials {
					username = ENV.MAVEN_USERNAME
					password = ENV.MAVEN_TOKEN
				}
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

java {
	withSourcesJar()
	withJavadocJar()
}

unifiedPublishing {
	project {
		displayName = "Genetics: Resequenced ${project.minecraft_version} ${project.version}"
		gameVersions = [project.minecraft_version]
		gameLoaders = ["forge"]

		changelog = "https://github.com/Berry-Club/Genetics-Resequenced/blob/Forge-1.20.1/CHANGELOG.md#" + project.mod_version.toString().replace(".", "")

		mainPublication jar

		relations {
			depends {
				curseforge = modrinth = "kotlin-for-forge"
			}

			depends {
				curseforge = modrinth = "aaron"
			}
		}

		if (ENV.CURSEFORGE_KEY) {
			curseforge {
				token = ENV.CURSEFORGE_KEY
				id = project.curseforge_id
			}
		}

		if (ENV.MODRINTH_TOKEN) {
			modrinth {
				token = ENV.MODRINTH_TOKEN
				id = project.modrinth_id
			}
		}

	}
}